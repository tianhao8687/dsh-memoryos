name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Contract tests
        run: node --test tests/contract.test.mjs tests/loader-composition.test.mjs
      - name: Bundle manifest and package contents
        run: |
          node -e "const p=require('./package.json'); if(p.dsh?.bundle?.patch!=='./cordis.patch.yml') process.exit(1)"
          npm pack --dry-run --ignore-scripts
